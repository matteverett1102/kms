name: Manual Build and Release KMS

on:
  workflow_dispatch:

jobs:
  build-multi-platform:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装多平台交叉编译器
        run: |
          sudo apt update
          sudo apt install -y make gcc gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu

      - name: 创建打包文件夹
        run: mkdir -p my_binaries/linux-x64 my_binaries/windows-x64 my_binaries/linux-arm64

      # ==================== 步骤 1：编译 Linux x64 ====================
      - name: 🛠️ 编译 Linux-x64 版本
        run: |
          make
          cp bin/* my_binaries/linux-x64/
          make clean

      # ==================== 步骤 2：编译 Windows x64 ====================
      - name: 🛠️ 编译 Windows-x64 版本
        run: |
          LDFLAGS=-static CC=x86_64-w64-mingw32-gcc make
          cp bin/* my_binaries/windows-x64/
          make clean

      # ==================== 步骤 3：编译 Linux ARM64 ====================
      - name: 🛠️ 编译 Linux-ARM64 版本
        run: |
          CC=aarch64-linux-gnu-gcc make
          cp bin/* my_binaries/linux-arm64/
          make clean

      # ==================== 步骤 4：打包与发布 ====================
      - name: 📦 压缩打包
        run: tar -czvf binaries.tar.gz my_binaries/

      - name: 🚀 自动清理旧版本并发布新版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete manual-release --yes --cleanup-tag || true
          gh release create manual-release binaries.tar.gz \
            --title "Manual Release (Multi-Platform)" \
            --notes "编译已完成！解压后进入 my_binaries 文件夹，即可按需取用 Windows (.exe) 或 Linux 版本。"
